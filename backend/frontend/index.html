
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marks Predictor</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #1e293b;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .tag {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 20px;
            background: #dbeafe;
            color: #1d4ed8;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 18px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 12px;
        }

        .description {
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px #dbeafe;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 18px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .result {
            display: none;
            margin-top: 25px;
            padding: 22px;
            border-radius: 12px;
            background: #eff6ff;
            text-align: center;
        }

        .result h2 {
            color: #1d4ed8;
            font-size: 15px;
            margin-bottom: 10px;
        }

        .marks {
            font-size: 42px;
            font-weight: bold;
            color: #1e40af;
        }

        .error {
            display: none;
            margin-top: 16px;
            color: #dc2626;
            font-size: 14px;
            line-height: 1.5;
        }

        footer {
            text-align: center;
            margin-top: 25px;
            color: #94a3b8;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <main class="container">
        <span class="tag">MACHINE LEARNING PROJECT</span>

        <h1>Student Marks Predictor 🎓</h1>

        <p class="description">
            Enter your daily study hours and let our
            Machine Learning model predict your marks.
        </p>

        <form id="predictionForm">
            <label for="studyHours">Study Hours Per Day</label>

            <input
                type="number"
                id="studyHours"
                placeholder="Example: 6"
                min="0"
                max="24"
                step="any"
                required
            >

            <button type="submit" id="predictButton">
                Predict My Marks
            </button>
        </form>

        <div class="result" id="result">
            <h2>Predicted Marks</h2>
            <div class="marks" id="marks">0</div>
            <p id="resultMessage"></p>
        </div>

        <p class="error" id="error"></p>

        <footer>
            Powered by Python, Scikit-learn & FastAPI
        </footer>
    </main>

    <script>
        const form = document.getElementById("predictionForm");
        const studyHoursInput = document.getElementById("studyHours");
        const predictButton = document.getElementById("predictButton");
        const result = document.getElementById("result");
        const marks = document.getElementById("marks");
        const resultMessage = document.getElementById("resultMessage");
        const error = document.getElementById("error");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const studyHours = Number(studyHoursInput.value);

            result.style.display = "none";
            error.style.display = "none";

            if (
                studyHoursInput.value.trim() === "" ||
                !Number.isFinite(studyHours) ||
                studyHours < 0 ||
                studyHours > 24
            ) {
                error.textContent = "Please enter study hours between 0 and 24.";
                error.style.display = "block";
                return;
            }

            predictButton.disabled = true;
            predictButton.textContent = "Predicting...";

            try {
                const response = await fetch(
                    "http://127.0.0.1:8000/predict",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            study_hours: studyHours
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.detail
                            ? JSON.stringify(data.detail)
                            : "Prediction failed."
                    );
                }

                marks.textContent = data.predicted_marks;
                resultMessage.textContent =
                    `For ${data.study_hours} study hours per day`;

                result.style.display = "block";

            } catch (err) {
                error.textContent =
                    "Could not connect to the backend. Make sure your FastAPI server is running at http://127.0.0.1:8000.";
                error.style.display = "block";

                console.error(err);

            } finally {
                predictButton.disabled = false;
                predictButton.textContent = "Predict My Marks";
            }
        });
    </script>
</body>
</html>
